<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 목록</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  /* =========================================================
     여기부터는 디자인(모양) 관련 코드입니다.
     보통은 안 건드리셔도 됩니다. (건드리지 않아도 문제 없어요)
     ========================================================= */
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --surface-2:#f1f2f8;
    --border:#e3e5ee;
    --text:#20222c;
    --text-dim:#6b6f80;
    --accent:#4f46e5;
    --accent-dim:#eef0fd;
    --accent-text:#3730a3;
    --green:#0f9d6b;
    --green-bg:#e8f8f1;
    --muted-bg:#f0f0f4;
    --muted-text:#8b8fa3;
    --shadow: 0 1px 2px rgba(20,22,40,.04), 0 6px 20px rgba(20,22,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14151c;
      --surface:#1c1e28;
      --surface-2:#22242f;
      --border:#2c2f3d;
      --text:#e7e8f0;
      --text-dim:#9598ab;
      --accent:#8b85f7;
      --accent-dim:#26243d;
      --accent-text:#c7c3ff;
      --green:#3ddc9b;
      --green-bg:#123227;
      --muted-bg:#23242e;
      --muted-text:#6d7086;
      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:22px; flex-wrap:wrap;
  }
  header.top h1{
    font-size:1.25rem; margin:0; font-weight:800; letter-spacing:-.01em;
  }
  .who{ font-size:.85rem; color:var(--text-dim); display:flex; gap:10px; align-items:center; }
  .who button{
    border:none; background:none; color:var(--accent); font-size:.85rem;
    cursor:pointer; padding:2px 0; text-decoration:underline; text-underline-offset:2px;
  }

  /* 로그인 화면 */
  #loginScreen{ text-align:center; padding:60px 8px; }
  #loginScreen h2{ font-size:1.15rem; margin:0 0 6px; }
  #loginScreen p{ color:var(--text-dim); margin:0 0 26px; font-size:.92rem; }
  .name-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr));
    gap:10px; max-width:420px; margin:0 auto;
  }
  .name-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 10px; font-size:1rem; font-weight:700; color:var(--text);
    cursor:pointer; box-shadow:var(--shadow); transition:.15s;
  }
  .name-btn:hover{ border-color:var(--accent); background:var(--accent-dim); }
  .name-btn.is-extra{ border-style:dashed; }

  .add-student-area{ margin-top:22px; }
  .add-student-toggle{
    border:1px dashed var(--border); background:none; color:var(--text-dim);
    font-size:.82rem; padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .add-student-toggle:hover{ color:var(--accent); border-color:var(--accent); }
  .add-student-form{
    display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;
  }
  .add-student-form input{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:8px 10px; font-size:.9rem; width:160px;
  }
  .add-student-form button{
    border:none; border-radius:10px; padding:8px 14px; font-size:.85rem; font-weight:700;
    cursor:pointer;
  }
  .add-student-form button#confirmAddStudentBtn{ background:var(--accent); color:#fff; }
  .add-student-form button#cancelAddStudentBtn{ background:var(--muted-bg); color:var(--text-dim); }
  .add-student-hint{
    max-width:340px; margin:12px auto 0; font-size:.72rem; color:var(--muted-text); line-height:1.5;
  }
  .add-student-hint code{ background:var(--muted-bg); padding:1px 5px; border-radius:5px; }

  /* 과목(문법/독해) 탭 */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    flex:1; padding:14px 10px; border-radius:14px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:.95rem; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); text-align:center;
  }
  .tab-btn small{ display:block; font-weight:500; color:var(--text-dim); margin-top:3px; font-size:.75rem; }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-dim); color:var(--accent-text); }
  .tab-btn.active small{ color:var(--accent-text); opacity:.75; }

  .summary{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; font-size:.88rem; color:var(--text-dim); margin-bottom:20px;
  }
  .summary b{ color:var(--text); }
  .summary .dot{ opacity:.5; }

  details.chapter{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden;
  }
  details.chapter > summary{
    list-style:none; cursor:pointer; padding:14px 16px; font-weight:700;
    font-size:.95rem; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  details.chapter > summary::-webkit-details-marker{ display:none; }
  details.chapter > summary .cnt{ font-weight:500; color:var(--text-dim); font-size:.78rem; white-space:nowrap; }
  details.chapter > summary::before{
    content:"▸"; color:var(--accent); font-size:.8rem; transition:transform .15s;
  }
  details.chapter[open] > summary::before{ transform:rotate(90deg); }

  .lesson-list{ border-top:1px solid var(--border); }
  .lesson{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; border-bottom:1px solid var(--border);
  }
  .lesson:last-child{ border-bottom:none; }
  .lesson-title{ font-size:.9rem; }
  .lesson-title .page{
    display:inline-block; margin-left:6px; font-size:.72rem; color:var(--muted-text);
    background:var(--muted-bg); border-radius:6px; padding:1px 6px;
  }
  .lesson-title .grammar-tag{
    display:inline-block; margin-right:6px; font-size:.7rem; font-weight:700;
    color:var(--accent-text); background:var(--accent-dim); border-radius:6px; padding:1px 6px;
  }
  .watch-btn{
    flex-shrink:0; text-decoration:none; font-size:.82rem; font-weight:700;
    padding:7px 12px; border-radius:999px; white-space:nowrap;
    background:var(--green-bg); color:var(--green); border:1px solid transparent;
  }
  .watch-btn:hover{ filter:brightness(0.97); }
  .soon{
    flex-shrink:0; font-size:.78rem; font-weight:600; color:var(--muted-text);
    background:var(--muted-bg); padding:6px 12px; border-radius:999px; white-space:nowrap;
  }

  footer.note{ text-align:center; color:var(--muted-text); font-size:.75rem; margin-top:30px; }

  #mainScreen{ display:none; }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <h1 id="siteTitleHeader">강의 목록</h1>
    <div class="who" id="whoBox" style="display:none;">
      <span id="whoText"></span>
      <button id="switchUserBtn" type="button">다른 학생으로 보기</button>
    </div>
  </header>

  <!-- 로그인 화면: 학생 이름을 눌러 입장 -->
  <div id="loginScreen">
    <h2>안녕하세요 👋</h2>
    <p>내 이름을 눌러서 들어가세요</p>
    <div class="name-grid" id="nameGrid"></div>

    <div class="add-student-area">
      <button type="button" id="showAddStudentBtn" class="add-student-toggle">+ 새 학생 등록</button>
      <div id="addStudentForm" class="add-student-form" style="display:none;">
        <input type="text" id="newStudentInput" placeholder="학생 이름 입력" maxlength="20">
        <button type="button" id="confirmAddStudentBtn">등록</button>
        <button type="button" id="cancelAddStudentBtn">취소</button>
      </div>
      <p class="add-student-hint">여기서 등록한 학생은 <b>이 기기(브라우저)</b>에서만 보여요. 모든 컴퓨터·휴대폰에서 항상 보이게 하려면 파일 위쪽 <code>STUDENTS</code> 목록에도 이름을 추가해주세요.</p>
    </div>
  </div>

  <!-- 로그인 후 메인 화면: 문법/독해 탭 + 강의 목록 -->
  <div id="mainScreen">
    <div class="tabs" id="tabBox"></div>
    <div class="summary" id="summaryBox"></div>
    <div id="chapterBox"></div>
  </div>

  <footer class="note">영상 링크가 없는 강의는 “준비 중”으로 표시돼요. 선생님이 링크를 채워주시면 자동으로 “▶ 영상 보기” 버튼이 생겨요.</footer>
</div>


<script>
/* =====================================================================
   ▼▼▼ 여기부터 "데이터 영역" 입니다 — 프로그래밍을 몰라도 이 부분만
   고치시면 됩니다. 아래 안내를 읽고 원하는 곳을 수정하세요. ▼▼▼
   =====================================================================

   [1] 사이트 제목(학원/강좌 이름) 바꾸기
       → 바로 아래 SITE_TITLE 의 따옴표 안 글자만 바꾸세요.

   [2] 로그인할 학생 이름 바꾸기 / 추가 / 삭제
       → STUDENTS 배열 안에 "이름" 을 쉼표(,)로 구분해서 넣어주세요.
         이름을 추가하려면:   "홍길동",
         이름을 지우려면: 그 줄을 통째로 지우면 됩니다.

   [3] 강의(챕터/소단원) 추가 · 수정 · 삭제
       → 아래 SUBJECTS 안에 "문법"과 "독해" 두 과목이 있고,
         각 과목 안에는 chapters(챕터=대단원) 배열이 있습니다.
         각 챕터는 { title: "챕터 이름", lessons: [ ... ] } 형태이고,
         lessons 안에 강의(소단원)를 하나씩 아래처럼 넣으면 됩니다:

           { title: "1강. be동사란 무엇인가", page: "p.10", url: "" }

         - title : 강의 제목 (필수)
         - page  : 교재 페이지 (선택, 없으면 그냥 "" 로 두거나 그 줄을 지워도 됨)
         - url   : 영상 링크 (선택). 네이버 마이박스나 유튜브 등 링크를
                   따옴표 안에 붙여넣으면 자동으로 "▶ 영상 보기" 버튼이 생깁니다.

   ===================================================================== */

  const STUDENTS = [

  // ---------- [3] 과목별 강의 목록 ----------
  const SUBJECTS = [

  /* =====================================================================
     ▲▲▲ 데이터 영역 끝. 여기부터 아래는 화면을 그려주는 코드라
     특별히 손대실 필요는 없습니다. ▲▲▲
     ===================================================================== */

  const LS_KEY = "lecture_page_student_name";
  const LS_EXTRA_STUDENTS_KEY = "lecture_page_extra_students";

  const $ = (sel) => document.querySelector(sel);
  const siteTitleHeader = $("#siteTitleHeader");
  const loginScreen = $("#loginScreen");
  const mainScreen = $("#mainScreen");
  const nameGrid = $("#nameGrid");
  const whoBox = $("#whoBox");
  const whoText = $("#whoText");
  const tabBox = $("#tabBox");
  const summaryBox = $("#summaryBox");
  const chapterBox = $("#chapterBox");
  const showAddStudentBtn = $("#showAddStudentBtn");
  const addStudentForm = $("#addStudentForm");
  const newStudentInput = $("#newStudentInput");
  const confirmAddStudentBtn = $("#confirmAddStudentBtn");
  const cancelAddStudentBtn = $("#cancelAddStudentBtn");

  // "+ 새 학생 등록" 버튼으로 추가한 이름은 이 브라우저의 localStorage에 저장됩니다.
  function getExtraStudents(){
    try {
      const raw = localStorage.getItem(LS_EXTRA_STUDENTS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveExtraStudents(list){
    localStorage.setItem(LS_EXTRA_STUDENTS_KEY, JSON.stringify(list));
  }
  function getAllStudents(){
    const extra = getExtraStudents();
    // 기본 명단(STUDENTS)에 이미 있는 이름은 중복으로 추가하지 않음
    return STUDENTS.concat(extra.filter((n) => !STUDENTS.includes(n)));
  }

  document.title = SITE_TITLE;
  siteTitleHeader.textContent = SITE_TITLE;

  let activeSubjectKey = SUBJECTS[0] ? SUBJECTS[0].key : null;

  function renderNameGrid(){
    nameGrid.innerHTML = "";
    const extra = getExtraStudents();
    getAllStudents().forEach((name) => {
      const btn = document.createElement("button");
      btn.className = "name-btn" + (extra.includes(name) ? " is-extra" : "");
      btn.type = "button";
      btn.textContent = name;
      btn.addEventListener("click", () => login(name));
      nameGrid.appendChild(btn);
    });
  }

  function addStudent(){
    const name = newStudentInput.value.trim();
    if (!name) return;
    if (getAllStudents().includes(name)) {
      alert("이미 등록된 이름이에요.");
      return;
    }
    const extra = getExtraStudents();
    extra.push(name);
    saveExtraStudents(extra);
    newStudentInput.value = "";
    addStudentForm.style.display = "none";
    renderNameGrid();
  }

  showAddStudentBtn.addEventListener("click", () => {
    addStudentForm.style.display = addStudentForm.style.display === "none" ? "flex" : "none";
    if (addStudentForm.style.display === "flex") newStudentInput.focus();
  });
  cancelAddStudentBtn.addEventListener("click", () => {
    addStudentForm.style.display = "none";
    newStudentInput.value = "";
  });
  confirmAddStudentBtn.addEventListener("click", addStudent);
  newStudentInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addStudent();
  });

  function login(name){
    localStorage.setItem(LS_KEY, name);
    showMain(name);
  }

  function logout(){
    localStorage.removeItem(LS_KEY);
    loginScreen.style.display = "";
    mainScreen.style.display = "none";
    whoBox.style.display = "none";
  }

  function showMain(name){
    loginScreen.style.display = "none";
    mainScreen.style.display = "block";
    whoBox.style.display = "flex";
    whoText.textContent = name + "님";
    renderTabs();
    renderSubject(activeSubjectKey);
  }

  function countSubject(subject){
    let total = 0, available = 0;
    subject.chapters.forEach((ch) => {
      ch.lessons.forEach((ls) => {
        total++;
        if (ls.url && ls.url.trim() !== "") available++;
      });
    });
    return { total, available };
  }

  function renderTabs(){
    tabBox.innerHTML = "";
    SUBJECTS.forEach((subject) => {
      const { total, available } = countSubject(subject);
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (subject.key === activeSubjectKey ? " active" : "");
      btn.type = "button";
      btn.innerHTML = subject.icon + " " + subject.label +
        "<small>" + total + "강 · 시청가능 " + available + "강</small>";
      btn.addEventListener("click", () => {
        activeSubjectKey = subject.key;
        renderTabs();
        renderSubject(activeSubjectKey);
      });
      tabBox.appendChild(btn);
    });
  }

  function renderSubject(key){
    const subject = SUBJECTS.find((s) => s.key === key);
    if (!subject) {
      summaryBox.textContent = "등록된 강의가 없어요.";
      chapterBox.innerHTML = "";
      return;
    }
    const { total, available } = countSubject(subject);
    summaryBox.innerHTML =
      "전체 <b>" + total + "강</b> <span class='dot'>·</span> 시청 가능 <b>" + available + "강</b>";

    chapterBox.innerHTML = "";
    subject.chapters.forEach((ch) => {
      const det = document.createElement("details");
      det.className = "chapter";

      const summary = document.createElement("summary");
      summary.innerHTML = "<span>" + escapeHtml(ch.title) + "</span>" +
        "<span class='cnt'>" + ch.lessons.length + "강</span>";
      det.appendChild(summary);

      const list = document.createElement("div");
      list.className = "lesson-list";

      ch.lessons.forEach((ls) => {
        const row = document.createElement("div");
        row.className = "lesson";

        const titleWrap = document.createElement("div");
        titleWrap.className = "lesson-title";
        let html = escapeHtml(ls.title);
        if (ls.page && ls.page.trim() !== "") {
          html += " <span class='page'>" + escapeHtml(ls.page) + "</span>";
        }
        titleWrap.innerHTML = html;
        row.appendChild(titleWrap);

        if (ls.url && ls.url.trim() !== "") {
          const a = document.createElement("a");
          a.className = "watch-btn";
          a.href = ls.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "▶ 영상 보기";
          row.appendChild(a);
        } else {
          const span = document.createElement("span");
          span.className = "soon";
          span.textContent = "준비 중";
          row.appendChild(span);
        }

        list.appendChild(row);
      });

      det.appendChild(list);
      chapterBox.appendChild(det);
    });
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  $("#switchUserBtn").addEventListener("click", logout);

  // 시작: 이전에 로그인했던 이름이 있으면 자동으로 이어서 보여주기
  renderNameGrid();
  const saved = localStorage.getItem(LS_KEY);
  if (saved && getAllStudents().includes(saved)) {
    showMain(saved);
  }
