<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 목록</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  /* =========================================================
     여기부터는 디자인(모양) 관련 코드입니다.
     보통은 안 건드리셔도 됩니다. (건드리지 않아도 문제 없어요)
     ========================================================= */
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --surface-2:#f1f2f8;
    --border:#e3e5ee;
    --text:#20222c;
    --text-dim:#6b6f80;
    --accent:#4f46e5;
    --accent-dim:#eef0fd;
    --accent-text:#3730a3;
    --green:#0f9d6b;
    --green-bg:#e8f8f1;
    --muted-bg:#f0f0f4;
    --muted-text:#8b8fa3;
    --shadow: 0 1px 2px rgba(20,22,40,.04), 0 6px 20px rgba(20,22,40,.05);
    --overlay: rgba(20,22,32,.45);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14151c;
      --surface:#1c1e28;
      --surface-2:#22242f;
      --border:#2c2f3d;
      --text:#e7e8f0;
      --text-dim:#9598ab;
      --accent:#8b85f7;
      --accent-dim:#26243d;
      --accent-text:#c7c3ff;
      --green:#3ddc9b;
      --green-bg:#123227;
      --muted-bg:#23242e;
      --muted-text:#6d7086;
      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
      --overlay: rgba(0,0,0,.6);
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:22px; flex-wrap:wrap;
  }
  header.top h1{
    font-size:1.25rem; margin:0; font-weight:800; letter-spacing:-.01em;
  }
  .who{ font-size:.85rem; color:var(--text-dim); display:flex; gap:10px; align-items:center; }
  .who button{
    border:none; background:none; color:var(--accent); font-size:.85rem;
    cursor:pointer; padding:2px 0; text-decoration:underline; text-underline-offset:2px;
  }

  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* 로그인 화면 */
  #loginScreen{ text-align:center; padding:60px 8px; }
  #loginScreen h2{ font-size:1.15rem; margin:0 0 6px; }
  #loginScreen p{ color:var(--text-dim); margin:0 0 26px; font-size:.92rem; }
  .name-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr));
    gap:10px; max-width:420px; margin:0 auto;
  }
  .name-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 10px; font-size:1rem; font-weight:700; color:var(--text);
    cursor:pointer; box-shadow:var(--shadow); transition:.15s;
  }
  .name-btn:hover{ border-color:var(--accent); background:var(--accent-dim); }
  .name-btn.is-extra{ border-style:dashed; }

  .add-student-area{ margin-top:22px; }
  .add-student-toggle{
    border:1px dashed var(--border); background:none; color:var(--text-dim);
    font-size:.82rem; padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .add-student-toggle:hover{ color:var(--accent); border-color:var(--accent); }
  .add-student-form{
    display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;
  }
  .add-student-form input{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:8px 10px; font-size:.9rem;
  }
  .add-student-form input#newStudentInput{ width:140px; }
  .add-student-form input#newStudentPin{ width:90px; text-align:center; letter-spacing:.2em; }
  .add-student-form button{
    border:none; border-radius:10px; padding:8px 14px; font-size:.85rem; font-weight:700;
    cursor:pointer;
  }
  .add-student-form button#confirmAddStudentBtn{ background:var(--accent); color:#fff; }
  .add-student-form button#cancelAddStudentBtn{ background:var(--muted-bg); color:var(--text-dim); }
  .add-student-hint{
    max-width:360px; margin:12px auto 0; font-size:.72rem; color:var(--muted-text); line-height:1.5;
  }
  .add-student-hint code{ background:var(--muted-bg); padding:1px 5px; border-radius:5px; }

  /* PIN 입력 모달 */
  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .modal-card{
    width:100%; max-width:280px; background:var(--surface); border-radius:18px;
    padding:24px; box-shadow:var(--shadow); text-align:center;
  }
  .modal-card h3{ margin:0 0 4px; font-size:1.05rem; }
  .modal-card p{ margin:0 0 16px; color:var(--text-dim); font-size:.85rem; }
  .modal-card input{
    width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:12px; padding:12px; font-size:1.5rem; letter-spacing:.5em; text-align:center;
    margin-bottom:14px;
  }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{
    flex:1; border:none; border-radius:10px; padding:10px; font-size:.88rem; font-weight:700; cursor:pointer;
  }
  .modal-actions button.cancel{ background:var(--muted-bg); color:var(--text-dim); }
  .modal-actions button.confirm{ background:var(--accent); color:#fff; }

  /* 과목(문법/독해) 탭 */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    flex:1; padding:14px 10px; border-radius:14px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:.95rem; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); text-align:center;
  }
  .tab-btn small{ display:block; font-weight:500; color:var(--text-dim); margin-top:3px; font-size:.75rem; }
  .tab-btn.active{ border-color:var(--accent); background:var(--accent-dim); color:var(--accent-text); }
  .tab-btn.active small{ color:var(--accent-text); opacity:.75; }

  /* 뒤로가기 + 현재 위치 */
  .nav-header{
    display:flex; align-items:center; gap:10px; margin-bottom:12px; min-height:32px;
  }
  .back-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:6px 12px; font-size:.82rem; font-weight:700; cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .breadcrumb{ font-size:.9rem; font-weight:700; color:var(--text); }
  .breadcrumb .dim{ color:var(--text-dim); font-weight:500; }

  .summary{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; font-size:.88rem; color:var(--text-dim); margin-bottom:20px;
  }
  .summary b{ color:var(--text); }
  .summary .dot{ opacity:.5; }

  /* 시리즈 / 챕터 목록 (클릭하면 다음 단계로 이동) */
  .nav-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; text-align:left; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:10px; cursor:pointer;
    box-shadow:var(--shadow); font-size:.95rem; font-weight:700; color:var(--text);
  }
  .nav-row:hover{ border-color:var(--accent); background:var(--accent-dim); }
  .nav-row .meta{ font-weight:500; color:var(--text-dim); font-size:.78rem; margin-top:3px; }
  .nav-row .chev{ color:var(--accent); font-size:1rem; flex-shrink:0; }

  .lesson-list{ display:flex; flex-direction:column; gap:8px; }
  .lesson{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; border:1px solid var(--border); border-radius:12px;
    background:var(--surface); box-shadow:var(--shadow);
  }
  .lesson-title{ font-size:.9rem; }
  .lesson-title .page{
    display:inline-block; margin-left:6px; font-size:.72rem; color:var(--muted-text);
    background:var(--muted-bg); border-radius:6px; padding:1px 6px;
  }
  .watch-btn{
    flex-shrink:0; text-decoration:none; font-size:.82rem; font-weight:700;
    padding:7px 12px; border-radius:999px; white-space:nowrap;
    background:var(--green-bg); color:var(--green); border:1px solid transparent;
  }
  .watch-btn:hover{ filter:brightness(0.97); }
  .soon{
    flex-shrink:0; font-size:.78rem; font-weight:600; color:var(--muted-text);
    background:var(--muted-bg); padding:6px 12px; border-radius:999px; white-space:nowrap;
  }

  footer.note{ text-align:center; color:var(--muted-text); font-size:.75rem; margin-top:30px; }

  @media (prefers-reduced-motion: reduce){
    .name-btn, .tab-btn, .watch-btn, .nav-row, .add-student-toggle{ transition:none; }
  }

  #mainScreen{ display:none; }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <h1 id="siteTitleHeader">강의 목록</h1>
    <div class="who" id="whoBox" style="display:none;">
      <span id="whoText"></span>
      <button id="switchUserBtn" type="button">다른 학생으로 보기</button>
    </div>
  </header>

  <!-- 로그인 화면: 학생 이름을 눌러 PIN을 입력하고 입장 -->
  <div id="loginScreen">
    <h2>안녕하세요 👋</h2>
    <p>내 이름을 누르고 비밀번호(4자리)를 입력하세요</p>
    <div class="name-grid" id="nameGrid"></div>

    <div class="add-student-area">
      <button type="button" id="showAddStudentBtn" class="add-student-toggle">+ 새 학생 등록</button>
      <div id="addStudentForm" class="add-student-form" style="display:none;">
        <input type="text" id="newStudentInput" placeholder="학생 이름" maxlength="20">
        <input type="text" id="newStudentPin" placeholder="비밀번호 4자리" inputmode="numeric" maxlength="4">
        <button type="button" id="confirmAddStudentBtn">등록</button>
        <button type="button" id="cancelAddStudentBtn">취소</button>
      </div>
      <p class="add-student-hint">여기서 등록한 학생은 <b>이 기기(브라우저)</b>에서만 보여요. 모든 컴퓨터·휴대폰에서 항상 보이게 하려면 파일 위쪽 <code>STUDENTS</code> 목록에도 이름과 비밀번호를 추가해주세요.</p>
    </div>
  </div>

  <!-- 로그인 후 메인 화면: 문법/독해 탭 → 시리즈 → 챕터 → 강의 -->
  <div id="mainScreen">
    <div class="tabs" id="tabBox"></div>
    <div class="nav-header" id="navHeader"></div>
    <div class="summary" id="summaryBox"></div>
    <div id="contentBox"></div>
  </div>

  <footer class="note">영상 링크가 없는 강의는 “준비 중”으로 표시돼요. 선생님이 링크를 채워주시면 자동으로 “▶ 영상 보기” 버튼이 생겨요.</footer>
</div>

<!-- PIN 입력 모달 -->
<div id="pinModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3 id="pinModalName"></h3>
    <p>비밀번호(4자리)를 입력해주세요</p>
    <input type="text" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="modal-actions">
      <button type="button" class="cancel" id="pinCancelBtn">취소</button>
      <button type="button" class="confirm" id="pinConfirmBtn">입장하기</button>
    </div>
  </div>
</div>


<script>
/* =====================================================================
   ▼▼▼ 여기부터 "데이터 영역" 입니다 — 프로그래밍을 몰라도 이 부분만
   고치시면 됩니다. 아래 안내를 읽고 원하는 곳을 수정하세요. ▼▼▼
   =====================================================================

   [1] 사이트 제목(학원/강좌 이름) 바꾸기
       → 바로 아래 SITE_TITLE 의 따옴표 안 글자만 바꾸세요.

   [2] 로그인할 학생 이름 · 비밀번호 바꾸기 / 추가 / 삭제
       → STUDENTS 배열 안에 { name: "이름", pin: "1234" } 형태로 넣어주세요.
         pin은 학생이 로그인할 때 입력하는 4자리 숫자예요.
         ⚠️ 지금 들어있는 비밀번호(1001, 1002...)는 예시입니다.
            실제로 쓰기 전에 학생마다 다른 번호로 꼭 바꿔주세요!

   [3] 강의 추가 · 수정 · 삭제
       → SUBJECTS(문법/독해) → series(교재 시리즈, 예: 777초등영문법) →
         chapters(챕터/권/유닛) → lessons(실제 강의) 순서로 4단계 구조예요.
         학생 화면에서는: 과목 선택 → 시리즈 선택 → 챕터 선택 → 강의(영상) 순서로 들어갑니다.

         lessons 안에 강의를 하나씩 아래처럼 넣으면 됩니다:
           { title: "1강. be동사란 무엇인가", page: "p.10", url: "" }

         - title : 강의 제목 (필수)
         - page  : 교재 페이지 (선택, 없으면 "" 로 두거나 그 줄을 지워도 됨)
         - url   : 영상 링크 (선택). 네이버 마이박스나 유튜브 등 링크를
                   따옴표 안에 붙여넣으면 자동으로 "▶ 영상 보기" 버튼이 생깁니다.
                   비워두면( "" ) "준비 중"으로 표시됩니다.

       ※ 새 강의/챕터/시리즈를 추가할 때는 바로 위/아래의 { ... } 형태를
         그대로 복사해서 안의 내용만 바꾸면 안전합니다.
         (중괄호 { }, 대괄호 [ ], 쉼표 , 는 지우지 않도록 주의해주세요)
   ===================================================================== */

  // ---------- [1] 페이지 제목 ----------
  const SITE_TITLE = "삼성영어 셀레나 삼양캠퍼스";

  // ---------- [2] 로그인할 학생 이름 · 비밀번호 (기본 명단) ----------
  //  여기 적힌 학생은 모든 기기(컴퓨터/휴대폰)에서 항상 보입니다.
  //  수업 중 새로 등록하는 학생은 아래쪽 "+ 새 학생 등록" 버튼으로도
  //  추가할 수 있어요 (다만 그 버튼으로 추가한 학생은 등록한 그 기기의
  //  브라우저에만 저장돼요). 계속 모든 기기에 남기고 싶은 학생은
  //  이 목록에 직접 추가해주는 게 가장 확실합니다.
  const STUDENTS = [
    { name: "김라이", pin: "1001" },
    { name: "강승현", pin: "1002" },
    { name: "김효진", pin: "1003" },
    { name: "오지혜", pin: "1004" },
    { name: "이시은", pin: "1005" },
    { name: "손유찬", pin: "1006" },
    { name: "김아영", pin: "1007" },
    { name: "박서은", pin: "1008" },
    { name: "양정후", pin: "1009" },
    { name: "박승빈", pin: "1010" },
    { name: "차유준", pin: "1011" }
  ];

  // ---------- [3] 과목 → 시리즈(교재) → 챕터 → 강의 ----------
  const SUBJECTS = [
    {
      key: "grammar",
      label: "문법 영상",
      icon: "📖",
      series: [
        // ================= 777 초등영문법 시리즈 (0권 ~ 6권) =================
        { title: "777 초등영문법", chapters: [
          { title: "0권", lessons: [
            { title: "01. 명사! 모든 것들의 이름", url: "" },
            { title: "02. 강아지가 한 마리면 a dog, 여러 마리면 dogs", url: "" },
            { title: "03. 명사의 복수형", url: "" },
            { title: "04. 셀 수 없는 명사", url: "" },
            { title: "05. 주격 대명사 I, We, You", url: "" },
            { title: "06. 주격 대명사 He, She, They, It", url: "" },
            { title: "07. 목적격 대명사", url: "" },
            { title: "08. 소유격 대명사", url: "" },
            { title: "09. 지시대명사", url: "" },
            { title: "10. be동사 '(~이)다'", url: "" },
            { title: "11. be동사 '(~에) 있다'", url: "" },
            { title: "12. be동사의 부정문", url: "" },
            { title: "13. be동사로 묻고 답하기", url: "" },
            { title: "14. 일반동사", url: "" },
            { title: "15. 일반동사의 부정문", url: "" }
          ]},
          { title: "1권", lessons: [
            { title: "01. 문장의 순서", url: "" },
            { title: "02. 명사! 모든 것들의 이름", url: "" },
            { title: "03. 셀 수 없는 명사", url: "" },
            { title: "04. 셀 수 있는 명사의 복수형", url: "" },
            { title: "05. 관사! 명사의 짝꿍", url: "" },
            { title: "06. 인칭대명사", url: "" },
            { title: "07. 지시대명사", url: "" },
            { title: "08. be동사", url: "" },
            { title: "09. 일반동사의 현재형", url: "" },
            { title: "10. 일반동사의 3인칭 단수형", url: "" },
            { title: "11. be동사의 부정문", url: "" },
            { title: "12. 일반동사의 부정문", url: "" },
            { title: "13. be동사로 묻고 답하기", url: "" },
            { title: "14. 일반동사로 묻고 답하기", url: "" },
            { title: "15. 의문사로 의문문 만들기", url: "" }
          ]},
          { title: "2권", lessons: [
            { title: "01. 동사를 돕는 조동사", url: "" },
            { title: "02. 할 수 있어! can", url: "" },
            { title: "03. 꼭 해야 해! must", url: "" },
            { title: "04. be동사 과거형", url: "" },
            { title: "05. 일반동사 과거형", url: "" },
            { title: "06. 꾸미고 설명하는 형용사", url: "" },
            { title: "07. 꾸미기 대장, 부사", url: "" },
            { title: "08. '해라!' 명령문", url: "" },
            { title: "09. '하지 마!' 부정 명령문", url: "" },
            { title: "10. '함께 해' 청유문", url: "" },

            { title: "28. 엄마 동물이 지친 대처법", page: "p.104", url: "" },
            { title: "29. 별의 일생", page: "p.106", url: "" },
            { title: "30. (English Only) 가나의 장례 풍습", page: "p.108", url: "" }
          ]},
          { title: "Unit 11", lessons: [
            { title: "31. 못난이 채소들의 멋진 다짐", page: "p.114", url: "" },
            { title: "32. 수컷 물고기가 사라지고 있어!", page: "p.116", url: "" },
            { title: "33. 홍-사랑의 옹 이야기", page: "p.118", url: "" }
          ]},
          { title: "Unit 12", lessons: [
            { title: "34. 기억력 마법의 비결", page: "p.124", url: "" },
            { title: "35. (English Only) 자연 최고의 건축가, 흰개미", page: "p.126", url: "" },
            { title: "36. \"Mentor\"의 기원", page: "p.128", url: "" }
          ]}
        ]}
      ]
    }
  ];

  /* =====================================================================
     ▲▲▲ 데이터 영역 끝. 여기부터 아래는 화면을 그려주는 코드라
     특별히 손대실 필요는 없습니다. ▲▲▲
     ===================================================================== */

  const LS_KEY = "lecture_page_student_name";
  const LS_EXTRA_STUDENTS_KEY = "lecture_page_extra_students";

  const $ = (sel) => document.querySelector(sel);
  const siteTitleHeader = $("#siteTitleHeader");
  const loginScreen = $("#loginScreen");
  const mainScreen = $("#mainScreen");
  const nameGrid = $("#nameGrid");
  const whoBox = $("#whoBox");
  const whoText = $("#whoText");
  const tabBox = $("#tabBox");
  const navHeader = $("#navHeader");
  const summaryBox = $("#summaryBox");
  const contentBox = $("#contentBox");
  const showAddStudentBtn = $("#showAddStudentBtn");
  const addStudentForm = $("#addStudentForm");
  const newStudentInput = $("#newStudentInput");
  const newStudentPin = $("#newStudentPin");
  const confirmAddStudentBtn = $("#confirmAddStudentBtn");
  const cancelAddStudentBtn = $("#cancelAddStudentBtn");
  const pinModal = $("#pinModal");
  const pinModalName = $("#pinModalName");
  const pinInput = $("#pinInput");
  const pinCancelBtn = $("#pinCancelBtn");
  const pinConfirmBtn = $("#pinConfirmBtn");

  document.title = SITE_TITLE;
  siteTitleHeader.textContent = SITE_TITLE;

  // ---------------- 학생 목록 (기본 + 이 브라우저에서 추가한 학생) ----------------
  function getExtraStudents(){
    try {
      const raw = localStorage.getItem(LS_EXTRA_STUDENTS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveExtraStudents(list){
    localStorage.setItem(LS_EXTRA_STUDENTS_KEY, JSON.stringify(list));
  }
  function getAllStudents(){
    const extra = getExtraStudents();
    const baseNames = STUDENTS.map((s) => s.name);
    return STUDENTS.concat(extra.filter((s) => !baseNames.includes(s.name)));
  }

  function renderNameGrid(){
    nameGrid.innerHTML = "";
    const extraNames = getExtraStudents().map((s) => s.name);
    getAllStudents().forEach((student) => {
      const btn = document.createElement("button");
      btn.className = "name-btn" + (extraNames.includes(student.name) ? " is-extra" : "");
      btn.type = "button";
      btn.textContent = student.name;
      btn.addEventListener("click", () => openPinModal(student));
      nameGrid.appendChild(btn);
    });
  }

  function addStudent(){
    const name = newStudentInput.value.trim();
    const pin = newStudentPin.value.trim();
    if (!name) { alert("이름을 입력해주세요."); return; }
    if (pin.length !== 4 || !/^\d{4}$/.test(pin)) { alert("비밀번호는 숫자 4자리로 입력해주세요."); return; }
    if (getAllStudents().some((s) => s.name === name)) { alert("이미 등록된 이름이에요."); return; }
    const extra = getExtraStudents();
    extra.push({ name, pin });
    saveExtraStudents(extra);
    newStudentInput.value = "";
    newStudentPin.value = "";
    addStudentForm.style.display = "none";
    renderNameGrid();
  }

  showAddStudentBtn.addEventListener("click", () => {
    addStudentForm.style.display = addStudentForm.style.display === "none" ? "flex" : "none";
    if (addStudentForm.style.display === "flex") newStudentInput.focus();
  });
  cancelAddStudentBtn.addEventListener("click", () => {
    addStudentForm.style.display = "none";
    newStudentInput.value = "";
    newStudentPin.value = "";
  });
  confirmAddStudentBtn.addEventListener("click", addStudent);
  newStudentPin.addEventListener("keydown", (e) => { if (e.key === "Enter") addStudent(); });

  // ---------------- PIN 로그인 모달 ----------------
  let pendingStudent = null;

  function openPinModal(student){
    pendingStudent = student;
    pinModalName.textContent = student.name + "님, 안녕하세요!";
    pinInput.value = "";
    pinModal.style.display = "flex";
    pinInput.focus();
  }
  function closePinModal(){
    pinModal.style.display = "none";
    pendingStudent = null;
  }
  function confirmPin(){
    if (!pendingStudent) return;
    if (pinInput.value === pendingStudent.pin) {
      const name = pendingStudent.name;
      closePinModal();
      login(name);
    } else {
      alert("비밀번호가 맞지 않아요. 다시 시도해주세요.");
      pinInput.value = "";
      pinInput.focus();
    }
  }
  pinCancelBtn.addEventListener("click", closePinModal);
  pinConfirmBtn.addEventListener("click", confirmPin);
  pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") confirmPin(); });
  pinModal.addEventListener("click", (e) => { if (e.target === pinModal) closePinModal(); });

  function login(name){
    localStorage.setItem(LS_KEY, name);
    showMain(name);
  }
  function logout(){
    localStorage.removeItem(LS_KEY);
    loginScreen.style.display = "";
    mainScreen.style.display = "none";
    whoBox.style.display = "none";
  }

  // ---------------- 화면 상태: 과목 → 시리즈 → 챕터 → 강의 ----------------
  let nav = { subjectKey: SUBJECTS[0] ? SUBJECTS[0].key : null, view: "series", seriesIdx: null, chapterIdx: null };

  function currentSubject(){ return SUBJECTS.find((s) => s.key === nav.subjectKey) || null; }
  function currentSeries(){ const subj = currentSubject(); return subj ? subj.series[nav.seriesIdx] : null; }
  function currentChapter(){ const series = currentSeries(); return series ? series.chapters[nav.chapterIdx] : null; }

  function countLessons(chapters){
    let total = 0, available = 0;
    chapters.forEach((ch) => {
      ch.lessons.forEach((ls) => {
        total++;
        if (ls.url && ls.url.trim() !== "") available++;
      });
    });
    return { total, available };
  }
  function countSubject(subject){
    let total = 0, available = 0;
    subject.series.forEach((se) => {
      const c = countLessons(se.chapters);
      total += c.total; available += c.available;
    });
    return { total, available };
  }

  function showMain(name){
    loginScreen.style.display = "none";
    mainScreen.style.display = "block";
    whoBox.style.display = "flex";
    whoText.textContent = name + "님";
    nav = { subjectKey: SUBJECTS[0] ? SUBJECTS[0].key : null, view: "series", seriesIdx: null, chapterIdx: null };
    renderAll();
  }

  function switchSubject(key){
    nav = { subjectKey: key, view: "series", seriesIdx: null, chapterIdx: null };
    renderAll();
  }
  function openSeries(idx){
    nav.view = "chapters"; nav.seriesIdx = idx; nav.chapterIdx = null;
    renderAll();
  }
  function openChapter(idx){
    nav.view = "lessons"; nav.chapterIdx = idx;
    renderAll();
  }
  function goBack(){
    if (nav.view === "lessons") { nav.view = "chapters"; nav.chapterIdx = null; }
    else if (nav.view === "chapters") { nav.view = "series"; nav.seriesIdx = null; }
    renderAll();
  }

  function renderAll(){
    renderTabs();
    renderNavHeader();
    renderSummary();
    renderContent();
  }

  function renderTabs(){
    tabBox.innerHTML = "";
    SUBJECTS.forEach((subject) => {
      const { total, available } = countSubject(subject);
      const btn = document.createElement("button");
      btn.className = "tab-btn" + (subject.key === nav.subjectKey ? " active" : "");
      btn.type = "button";
      btn.innerHTML = subject.icon + " " + escapeHtml(subject.label) +
        "<small>" + total + "강 · 시청가능 " + available + "강</small>";
      btn.addEventListener("click", () => switchSubject(subject.key));
      tabBox.appendChild(btn);
    });
  }

  function renderNavHeader(){
    navHeader.innerHTML = "";
    if (nav.view === "series") return;

    const back = document.createElement("button");
    back.type = "button";
    back.className = "back-btn";
    back.textContent = "← 뒤로";
    back.addEventListener("click", goBack);
    navHeader.appendChild(back);

    const crumb = document.createElement("span");
    crumb.className = "breadcrumb";
    if (nav.view === "chapters") {
      crumb.textContent = currentSeries().title;
    } else if (nav.view === "lessons") {
      crumb.innerHTML = "<span class='dim'>" + escapeHtml(currentSeries().title) + " ›</span> " + escapeHtml(currentChapter().title);
    }
    navHeader.appendChild(crumb);
  }

  function renderSummary(){
    const subject = currentSubject();
    if (!subject) { summaryBox.textContent = "등록된 강의가 없어요."; return; }

    let total = 0, available = 0, label = "전체";
    if (nav.view === "series") {
      ({ total, available } = countSubject(subject));
    } else if (nav.view === "chapters") {
      ({ total, available } = countLessons(currentSeries().chapters));
      label = currentSeries().title;
    } else if (nav.view === "lessons") {
      const ch = currentChapter();
      total = ch.lessons.length;
      available = ch.lessons.filter((ls) => ls.url && ls.url.trim() !== "").length;
      label = currentChapter().title;
    }
    summaryBox.innerHTML =
      escapeHtml(label) + " <b>" + total + "강</b> <span class='dot'>·</span> 시청 가능 <b>" + available + "강</b>";
  }

  function renderContent(){
    const subject = currentSubject();
    contentBox.innerHTML = "";
    if (!subject) return;

    if (nav.view === "series") {
      subject.series.forEach((se, idx) => {
        const c = countLessons(se.chapters);
        contentBox.appendChild(makeNavRow(se.title, se.chapters.length + "개 챕터 · " + c.total + "강", () => openSeries(idx)));
      });
      return;
    }

    if (nav.view === "chapters") {
      currentSeries().chapters.forEach((ch, idx) => {
        contentBox.appendChild(makeNavRow(ch.title, ch.lessons.length + "강", () => openChapter(idx)));
      });
      return;
    }

    if (nav.view === "lessons") {
      const list = document.createElement("div");
      list.className = "lesson-list";
      currentChapter().lessons.forEach((ls) => {
        const row = document.createElement("div");
        row.className = "lesson";

        const titleWrap = document.createElement("div");
        titleWrap.className = "lesson-title";
        let html = escapeHtml(ls.title);
        if (ls.page && ls.page.trim() !== "") {
          html += " <span class='page'>" + escapeHtml(ls.page) + "</span>";
        }
        titleWrap.innerHTML = html;
        row.appendChild(titleWrap);

        if (ls.url && ls.url.trim() !== "") {
          const a = document.createElement("a");
          a.className = "watch-btn";
          a.href = ls.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "▶ 영상 보기";
          row.appendChild(a);
        } else {
          const span = document.createElement("span");
          span.className = "soon";
          span.textContent = "준비 중";
          row.appendChild(span);
        }
        list.appendChild(row);
      });
      contentBox.appendChild(list);
    }
  }

  function makeNavRow(title, meta, onClick){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "nav-row";
    btn.innerHTML =
      "<span><span>" + escapeHtml(title) + "</span><div class='meta'>" + escapeHtml(meta) + "</div></span>" +
      "<span class='chev'>›</span>";
    btn.addEventListener("click", onClick);
    return btn;
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  $("#switchUserBtn").addEventListener("click", logout);

  // 시작: 이전에 로그인했던 이름이 있으면 자동으로 이어서 보여주기
  renderNameGrid();
  const saved = localStorage.getItem(LS_KEY);
  if (saved && getAllStudents().some((s) => s.name === saved)) {
    showMain(saved);
  }
</script>
</body>
</html>
